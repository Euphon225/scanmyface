<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScanMyFace.tech — Scan your face. Build your player.</title>

    <!-- SENTRY LOADER (Assurance anti-crash) -->
    <script src="https://js-de.sentry-cdn.com/ddf19fe120e9c4fbe597112db630f8e1.min.js" crossorigin="anonymous">
    </script>

    <script>
        Sentry.onLoad(function () {
            Sentry.init({
                // Le DSN est déjà inclus dans le lien du script ci-dessus
                integrations: [new Sentry.BrowserTracing()],
                tracesSampleRate: 1.0,
            });
        });
    </script>

    <!-- SIMPLE ANALYTICS (Mesure de la hype Reddit) -->
    <script async src="https://scripts.simpleanalyticscdn.com/latest.js"></script>

    <style>
        /* Styles d'origine */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0c;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
        }

        #__bundler_thumbnail {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0c;
            z-index: 9999;
        }

        #__bundler_thumbnail svg {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Style pour le bouton Scan My Face */
        .btn-start {
            position: absolute;
            bottom: 15%;
            background: #00f0ff;
            color: #0a0a0c;
            padding: 18px 40px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 14px;
            z-index: 10001;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
        }

        .btn-start:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.6);
            background: #fff;
        }
    </style>
</head>

<body>

    <div id="__bundler_thumbnail">
        <!-- LOGO ET ANIMATION SVG[cite: 1] -->
        <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
            <rect width="1200" height="800" fill="#0a0a0c"></rect>
            <g transform="translate(600 400)" fill="none" stroke="#00f0ff" stroke-width="2">
                <circle r="180" opacity="0.2"></circle>
                <circle r="120" opacity="0.4"></circle>
                <circle r="60" opacity="0.7"></circle>
                <line x1="-200" y1="0" x2="200" y2="0" opacity="0.3"></line>
                <line x1="0" y1="-220" x2="0" y2="220" opacity="0.3"></line>
            </g>
            <g fill="#00f0ff">
                <circle cx="600" cy="400" r="4"></circle>
                <circle cx="540" cy="380" r="3"></circle>
                <circle cx="660" cy="380" r="3"></circle>
                <circle cx="600" cy="440" r="3"></circle>
            </g>
            <text x="600" y="600" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="42"
                font-weight="700" letter-spacing="2">SCANMYFACE<tspan fill="#00f0ff">.tech</tspan></text>
        </svg>

        <!-- BOUTON DE LANCEMENT -->
        <a href="./app/index.html" class="btn-start">Start Scanner</a>
    </div>

    <script>
        // Test Sentry : à supprimer après avoir vérifié que l'erreur apparaît sur ton dashboard Sentry
        // myUndefinedFunctionTest(); 
    </script>

</body>

</html>
