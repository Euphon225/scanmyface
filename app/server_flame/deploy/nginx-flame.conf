# nginx reverse-proxy FLAME → uvicorn 127.0.0.1:8001
# certbot ajoutera le bloc listen 443 + redirection HTTP→HTTPS automatiquement.
server {
    listen 80;
    server_name flame.scanmyface.tech;
    client_max_body_size 1m;          # body landmarks ~30 Ko, 1 Mo large

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;       # fit ~10-15 s, marge
        proxy_connect_timeout 60s;
    }
}
