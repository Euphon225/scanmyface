<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paiement validé - ScanMyFace</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0a0c;
            --bg-card: #16181c;
            --text-primary: #ffffff;
            --text-secondary: #a0aab2;
            --neon-cyan: #00f0ff;
            --neon-purple: #b026ff;
            --border-color: #2a2e33;
            --success: #00ff66;
            --font-heading: 'Outfit', sans-serif;
            --font-body: 'Inter', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-primary);
            font-family: var(--font-body);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Animated background gradient */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(176, 38, 255, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 80% 50%, rgba(0, 240, 255, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .success-container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 2rem;
            max-width: 600px;
            animation: slideIn 0.8s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Checkmark icon */
        .success-icon {
            width: 120px;
            height: 120px;
            margin: 0 auto 2rem;
            position: relative;
            animation: scaleIn 0.6s ease-out 0.2s both;
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.5);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .checkmark {
            width: 100%;
            height: 100%;
            border: 3px solid var(--success);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 255, 102, 0.05);
            box-shadow: 0 0 30px rgba(0, 255, 102, 0.3), inset 0 0 20px rgba(0, 255, 102, 0.1);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 0 30px rgba(0, 255, 102, 0.3), inset 0 0 20px rgba(0, 255, 102, 0.1);
            }
            50% {
                box-shadow: 0 0 50px rgba(0, 255, 102, 0.5), inset 0 0 30px rgba(0, 255, 102, 0.2);
            }
        }

        .checkmark::after {
            content: '✓';
            font-size: 60px;
            color: var(--success);
            font-weight: 800;
            line-height: 1;
        }

        /* Main title */
        .success-title {
            font-family: var(--font-heading);
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: fadeIn 0.8s ease-out 0.3s both;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* Confirmation message */
        .success-message {
            font-size: 1.2rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
            line-height: 1.6;
            animation: fadeIn 0.8s ease-out 0.4s both;
        }

        /* Status box */
        .status-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.8s ease-out 0.5s both;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
            font-size: 0.95rem;
        }

        .status-item:last-child {
            margin-bottom: 0;
        }

        .status-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: rgba(0, 255, 102, 0.2);
            border: 1.5px solid var(--success);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }

        .status-icon::after {
            content: '✓';
            color: var(--success);
            font-weight: bold;
        }

        .status-text {
            color: var(--text-primary);
        }

        .status-subtext {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        /* Redirect info */
        .redirect-info {
            font-size: 0.95rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
            animation: fadeIn 0.8s ease-out 0.6s both;
        }

        .countdown {
            font-family: 'Courier New', monospace;
            color: var(--neon-cyan);
            font-weight: 600;
            font-size: 1.1rem;
        }

        /* Session ID display */
        .session-id {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            margin-top: 2rem;
            word-break: break-all;
            font-family: 'Courier New', monospace;
            font-size: 0.75rem;
            color: var(--text-secondary);
            animation: fadeIn 0.8s ease-out 0.7s both;
        }

        .session-label {
            display: block;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--neon-purple);
            margin-bottom: 0.5rem;
            font-family: var(--font-body);
        }

        /* Action button */
        .btn-redirect {
            display: inline-block;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
            color: var(--bg-dark);
            border: none;
            padding: 1rem 2.5rem;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 24px rgba(0, 240, 255, 0.3);
            animation: fadeIn 0.8s ease-out 0.8s both;
        }

        .btn-redirect:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(0, 240, 255, 0.5);
        }

        .btn-redirect:active {
            transform: translateY(0);
        }

        /* Mobile responsive */
        @media (max-width: 600px) {
            .success-container {
                padding: 1.5rem;
            }

            .success-title {
                font-size: 2rem;
            }

            .success-icon {
                width: 100px;
                height: 100px;
            }

            .checkmark::after {
                font-size: 50px;
            }

            .success-message {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="success-container">
        <div class="success-icon">
            <div class="checkmark"></div>
        </div>

        <h1 class="success-title">Paiement validé !</h1>

        <p class="success-message">
            Votre accès ScanMyFace est maintenant actif.
        </p>

        <div class="status-box">
            <div class="status-item">
                <div class="status-icon"></div>
                <div>
                    <div class="status-text">Accès Premium activé</div>
                    <div class="status-subtext">Vous avez maintenant accès à toutes les fonctionnalités</div>
                </div>
            </div>
            <div class="status-item">
                <div class="status-icon"></div>
                <div>
                    <div class="status-text">Transaction sécurisée</div>
                    <div class="status-subtext">Paiement traité et confirmé</div>
                </div>
            </div>
        </div>

        <div class="redirect-info">
            Redirection automatique dans <span class="countdown" id="countdown">3</span> secondes...
        </div>

        <button class="btn-redirect" onclick="redirectToHome()">
            Commencer mon scan maintenant
        </button>

        <div id="session-container"></div>
    </div>

    <script>
        // Parse URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('session_id');

        // Display session ID if available
        if (sessionId) {
            const sessionContainer = document.getElementById('session-container');
            sessionContainer.innerHTML = `
                <div class="session-id">
                    <span class="session-label">Session ID</span>
                    ${sessionId}
                </div>
            `;
            console.log('Session ID:', sessionId);
        }

        // Countdown timer
        let secondsRemaining = 3;
        const countdownElement = document.getElementById('countdown');

        const countdownInterval = setInterval(() => {
            secondsRemaining--;
            countdownElement.textContent = secondsRemaining;

            if (secondsRemaining === 0) {
                clearInterval(countdownInterval);
                redirectToHome();
            }
        }, 1000);

        // Redirect function
        function redirectToHome() {
            // Unlock premium access in localStorage
            localStorage.setItem('premium_unlocked', 'true');
            // Redirect to home
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
